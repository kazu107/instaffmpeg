services:
  nerfstudio:
    image: ghcr.io/nerfstudio-project/nerfstudio:1.1.5
    working_dir: /workspace
    tty: true
    stdin_open: true
    shm_size: "8gb"
    gpus: all
    environment:
      PYTHONUNBUFFERED: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
    ports:
      - "7007:7007"
    volumes:
      - ./workspace:/workspace
      - ./cache:/home/user/.cache
    command: bash -lc "mkdir -p /workspace/data/raw /workspace/data/processed /workspace/outputs && sleep infinity"
